# CI Build Pipeline — lint, test (Windows + macOS)
# Trigger: push to main/release/*, PRs to main

trigger:
  branches:
    include:
      - main
      - release/*
  paths:
    exclude:
      - '*.md'
      - 'docs/**'
      - '*.yml'

variables:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

stages:
  # ── Stage 1: Lint & Format (Ubuntu — cheapest VM) ──────
  - stage: Check
    displayName: 'Lint & Format'
    jobs:
      - job: Fmt
        displayName: 'cargo fmt'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self
          - script: |
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --component rustfmt
              echo "##vso[task.prependpath]$HOME/.cargo/bin"
            displayName: 'Install Rust + rustfmt'
          - script: cargo fmt --all --check
            displayName: 'Check formatting'

      - job: Clippy
        displayName: 'cargo clippy'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self
          - script: |
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --component clippy
              echo "##vso[task.prependpath]$HOME/.cargo/bin"
            displayName: 'Install Rust + clippy'
          - script: cargo clippy --workspace --all-targets -- -D warnings
            displayName: 'Run clippy'

  # ── Stage 2: Test (Windows + macOS) ────────────────────
  - stage: Test
    displayName: 'Test'
    dependsOn: Check
    jobs:
      - job: TestWindows
        displayName: 'Test Windows'
        pool:
          vmImage: 'windows-latest'
        steps:
          - checkout: self
          - powershell: |
              Invoke-WebRequest -Uri https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe -OutFile rustup-init.exe
              .\rustup-init.exe -y --default-toolchain stable
              echo "##vso[task.prependpath]$env:USERPROFILE\.cargo\bin"
            displayName: 'Install Rust'
          - script: cargo test --workspace
            displayName: 'Run tests'

      - job: TestMacOS
        displayName: 'Test macOS'
        pool:
          vmImage: 'macOS-latest'
        steps:
          - checkout: self
          - script: |
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
              echo "##vso[task.prependpath]$HOME/.cargo/bin"
            displayName: 'Install Rust'
          - script: cargo test --workspace
            displayName: 'Run tests'

  # ── Stage 3: Coverage (Ubuntu — cheapest + fastest) ────
  - stage: Coverage
    displayName: 'Code Coverage'
    dependsOn: Test
    condition: succeeded()
    jobs:
      - job: LlvmCov
        displayName: 'cargo llvm-cov'
        pool:
          vmImage: 'ubuntu-latest'
        variables:
          # Don't treat warnings as errors for coverage build — we instrument,
          # we don't lint here.
          RUSTFLAGS: ''
        steps:
          - checkout: self
          - script: |
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --component llvm-tools-preview
              echo "##vso[task.prependpath]$HOME/.cargo/bin"
            displayName: 'Install Rust + llvm-tools-preview'
          - script: cargo install cargo-llvm-cov --locked
            displayName: 'Install cargo-llvm-cov'
          - script: |
              cargo llvm-cov --workspace --no-report \
                --ignore-filename-regex '(agm-lsp|tests/)'
            displayName: 'Run instrumented tests'
          - script: |
              cargo llvm-cov report --cobertura --output-path coverage.xml \
                --ignore-filename-regex '(agm-lsp|tests/)'
            displayName: 'Generate Cobertura report'
          - script: |
              cargo llvm-cov report --summary-only \
                --ignore-filename-regex '(agm-lsp|tests/)' \
                | tee coverage-summary.txt
            displayName: 'Print coverage summary'
          - script: |
              cargo llvm-cov report --html --output-dir coverage-html \
                --ignore-filename-regex '(agm-lsp|tests/)'
            displayName: 'Generate HTML report'
          - task: PublishCodeCoverageResults@2
            displayName: 'Publish coverage to Azure'
            inputs:
              summaryFileLocation: '$(Build.SourcesDirectory)/coverage.xml'
              pathToSources: '$(Build.SourcesDirectory)'
          - task: PublishBuildArtifacts@1
            displayName: 'Publish HTML report artifact'
            inputs:
              pathToPublish: 'coverage-html'
              artifactName: 'coverage-html'
          - task: PublishBuildArtifacts@1
            displayName: 'Publish summary artifact'
            inputs:
              pathToPublish: 'coverage-summary.txt'
              artifactName: 'coverage-summary'
