[workspace]
resolver = "3"
members = ["crates/agm-core", "crates/agm-cli"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["Jose Angel Avila"]
repository = "https://github.com/JAAvila-Of/agm-cli"
homepage = "https://github.com/JAAvila-Of/agm-cli"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
miette = { version = "7", features = ["fancy"] }
petgraph = "0.7"
regex = "1"
semver = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
insta = { version = "1", features = ["yaml"] }
tempfile = "3"
self_update = { version = "0.42", features = ["archive-zip", "archive-tar", "compression-zip-deflate"] }
