# Release Pipeline — validate, test, build installers, publish, GitHub release
# Trigger: push tag v*

trigger:
  tags:
    include:
      - 'refs/tags/v*'

variables:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  TAG_NAME: $[replace(variables['Build.SourceBranch'], 'refs/tags/', '')]

stages:
  # ── Stage 1: Validate tag matches Cargo.toml ───────────
  - stage: Validate
    displayName: 'Validate Release Tag'
    jobs:
      - job: ValidateVersion
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self
          - script: |
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
              echo "##vso[task.prependpath]$HOME/.cargo/bin"
            displayName: 'Install Rust'
          - script: |
              TAG="$(TAG_NAME)"
              CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 \
                | python3 -c "import sys,json; pkgs=json.load(sys.stdin)['packages']; print([p['version'] for p in pkgs if p['name']=='agm-cli'][0])")
              echo "Tag: $TAG — Cargo.toml version: $CARGO_VERSION"

              if [ "v$CARGO_VERSION" != "$TAG" ]; then
                echo "##vso[task.logissue type=error]Tag $TAG does not match Cargo.toml version v$CARGO_VERSION"
                exit 1
              fi

              echo "Version validated: $CARGO_VERSION"
            displayName: 'Check tag matches Cargo.toml version'

  # ── Stage 2: Test (Windows + macOS) ────────────────────
  - stage: Test
    displayName: 'Full Test Suite'
    dependsOn: Validate
    jobs:
      - job: TestWindows
        displayName: 'Test Windows'
        pool:
          vmImage: 'windows-latest'
        steps:
          - checkout: self
          - powershell: |
              Invoke-WebRequest -Uri https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe -OutFile rustup-init.exe
              .\rustup-init.exe -y --default-toolchain stable
              echo "##vso[task.prependpath]$env:USERPROFILE\.cargo\bin"
            displayName: 'Install Rust'
          - script: cargo test --workspace
            displayName: 'Run tests'

      - job: TestMacOS
        displayName: 'Test macOS'
        pool:
          vmImage: 'macOS-latest'
        steps:
          - checkout: self
          - script: |
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
              echo "##vso[task.prependpath]$HOME/.cargo/bin"
            displayName: 'Install Rust'
          - script: cargo test --workspace
            displayName: 'Run tests'

  # ── Stage 3: Build Windows MSI Installer ───────────────
  - stage: BuildWindows
    displayName: 'Build Windows MSI'
    dependsOn: Test
    jobs:
      - job: MSI
        displayName: 'Windows x86_64 MSI'
        pool:
          vmImage: 'windows-latest'
        steps:
          - checkout: self
          - powershell: |
              Invoke-WebRequest -Uri https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe -OutFile rustup-init.exe
              .\rustup-init.exe -y --default-toolchain stable
              echo "##vso[task.prependpath]$env:USERPROFILE\.cargo\bin"
            displayName: 'Install Rust'
          - powershell: cargo install cargo-wix --version 0.3
            displayName: 'Install cargo-wix'
          - script: cargo build --release -p agm-cli
            displayName: 'Build release binary'
          - powershell: |
              cargo wix --no-build --nocapture -p agm-cli -o target\wix\agm-$(TAG_NAME)-x86_64-windows.msi
            displayName: 'Build MSI installer'
          # Also package zip for users who prefer portable
          - powershell: |
              Compress-Archive -Path target\release\agm.exe, LICENSE, README.md `
                -DestinationPath "target\release\agm-$(TAG_NAME)-x86_64-windows.zip"
            displayName: 'Package portable zip'
          - publish: target/wix/agm-$(TAG_NAME)-x86_64-windows.msi
            artifact: windows-msi
          - publish: target/release/agm-$(TAG_NAME)-x86_64-windows.zip
            artifact: windows-zip

  # ── Stage 4: Build macOS Universal .pkg Installer ──────
  - stage: BuildMacOS
    displayName: 'Build macOS Universal .pkg'
    dependsOn: Test
    jobs:
      - job: PKG
        displayName: 'macOS Universal (Intel + Apple Silicon)'
        pool:
          vmImage: 'macOS-latest'
        steps:
          - checkout: self
          - script: |
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable \
                --target x86_64-apple-darwin --target aarch64-apple-darwin
              echo "##vso[task.prependpath]$HOME/.cargo/bin"
            displayName: 'Install Rust + both targets'
          - script: |
              cargo build --release --target x86_64-apple-darwin -p agm-cli
              cargo build --release --target aarch64-apple-darwin -p agm-cli
            displayName: 'Build Intel + Apple Silicon binaries'
          - script: |
              mkdir -p target/universal
              lipo -create \
                target/x86_64-apple-darwin/release/agm \
                target/aarch64-apple-darwin/release/agm \
                -output target/universal/agm
              echo "Universal binary info:"
              lipo -info target/universal/agm
            displayName: 'Create universal binary (lipo)'
          - script: |
              VERSION=$(echo "$(TAG_NAME)" | sed 's/^v//')
              mkdir -p target/pkg-root/usr/local/bin
              cp target/universal/agm target/pkg-root/usr/local/bin/agm
              chmod 755 target/pkg-root/usr/local/bin/agm
              pkgbuild \
                --root target/pkg-root \
                --identifier com.jaavila.agm \
                --version "$VERSION" \
                --install-location / \
                "target/agm-$(TAG_NAME)-universal-macos.pkg"
            displayName: 'Build .pkg installer'
          # Also package tar.gz for Homebrew / manual installs
          - script: |
              cd target/universal
              tar czf ../agm-$(TAG_NAME)-universal-macos.tar.gz agm
            displayName: 'Package portable tar.gz'
          - publish: target/agm-$(TAG_NAME)-universal-macos.pkg
            artifact: macos-pkg
          - publish: target/universal/agm-$(TAG_NAME)-universal-macos.tar.gz
            artifact: macos-tar

  # ── Stage 5: Publish to crates.io ──────────────────────
  # Uses the 'cargo-connection' service connection (generic type).
  #
  # Setup in Azure DevOps → Project Settings → Service Connections → New:
  #   Type: Generic
  #   Name: cargo-connection
  #   Server URL: https://crates.io
  #   Password/Token Key: <your crates.io API token>
  #
  # The pipeline accesses the token at runtime via the Azure DevOps
  # REST API using the predefined $(System.AccessToken).
  - stage: PublishCrate
    displayName: 'Publish to crates.io'
    dependsOn:
      - BuildWindows
      - BuildMacOS
    jobs:
      - job: Publish
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self
          - script: |
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
              echo "##vso[task.prependpath]$HOME/.cargo/bin"
            displayName: 'Install Rust'
          - script: |
              # Fetch the crates.io token from the generic service connection
              ENDPOINT_ID=$(az devops service-endpoint list \
                --organization "$(System.CollectionUri)" \
                --project "$(System.TeamProject)" \
                --query "[?name=='Cargo Connection'].id" -o tsv)

              CRATES_TOKEN=$(az devops service-endpoint show \
                --id "$ENDPOINT_ID" \
                --organization "$(System.CollectionUri)" \
                --project "$(System.TeamProject)" \
                --query "authorization.parameters.password" -o tsv)

              echo "##vso[task.setvariable variable=CARGO_REGISTRY_TOKEN;issecret=true]$CRATES_TOKEN"
            displayName: 'Fetch token from Cargo Connection'
            env:
              AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
          - script: |
              echo "Publishing agm-core..."
              cargo publish -p agm-core
              echo "Waiting for crates.io to index agm-core..."
              sleep 30
              echo "Publishing agm-cli..."
              cargo publish -p agm-cli
            displayName: 'Publish crates (core first, then cli)'
            env:
              CARGO_REGISTRY_TOKEN: $(CARGO_REGISTRY_TOKEN)

  # ── Stage 6: Create GitHub Release ─────────────────────
  - stage: GitHubRelease
    displayName: 'Create GitHub Release'
    dependsOn:
      - BuildWindows
      - BuildMacOS
    jobs:
      - job: Release
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - download: current
            patterns: '**/*'
            displayName: 'Download all artifacts'
          - task: GitHubRelease@1
            inputs:
              gitHubConnection: 'GitHub JAAvila-Of'
              repositoryName: 'JAAvila-Of/agm-cli'
              action: 'create'
              target: '$(Build.SourceVersion)'
              tagSource: 'gitTag'
              title: 'agm $(TAG_NAME)'
              releaseNotesSource: 'inline'
              releaseNotesInline: |
                ## Installation

                ### Windows
                - **Installer**: Download `agm-$(TAG_NAME)-x86_64-windows.msi` and run it
                - **Portable**: Download `agm-$(TAG_NAME)-x86_64-windows.zip` and extract

                ### macOS (Intel + Apple Silicon)
                - **Installer**: Download `agm-$(TAG_NAME)-universal-macos.pkg` and run it
                - **Portable**: Download `agm-$(TAG_NAME)-universal-macos.tar.gz` and extract

                ### cargo install
                ```sh
                cargo install agm-cli
                ```
              assets: |
                $(Pipeline.Workspace)/windows-msi/*
                $(Pipeline.Workspace)/windows-zip/*
                $(Pipeline.Workspace)/macos-pkg/*
                $(Pipeline.Workspace)/macos-tar/*
              isDraft: false
              isPreRelease: false
              changeLogCompareToRelease: 'lastFullRelease'
              changeLogType: 'commitBased'
            displayName: 'Create GitHub Release with installers'