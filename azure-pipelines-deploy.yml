# Release Pipeline — validate, test, build installers, publish, GitHub release
# Trigger: push tag v*

trigger:
  tags:
    include:
      - 'refs/tags/v*'

variables:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  TAG_NAME: $[replace(variables['Build.SourceBranch'], 'refs/tags/', '')]

stages:
  # ── Stage 1: Validate tag matches Cargo.toml ───────────
  - stage: Validate
    displayName: 'Validate Release Tag'
    jobs:
      - job: ValidateVersion
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self
          - script: |
              echo "=== Debug: Pipeline Variables ==="
              echo "Build.SourceBranch: $(Build.SourceBranch)"
              echo "Build.SourceVersion: $(Build.SourceVersion)"
              echo "Resource ref: $(resources.repositories['agm-cli'].ref)"
              echo "Resource version: $(resources.repositories['agm-cli'].version)"
              echo "TAG_NAME: $(TAG_NAME)"
            displayName: 'Debug - Verify trigger variables'