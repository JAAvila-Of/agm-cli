[package]
name = "agm-cli"
version = "1.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "CLI tool for parsing, validating, and orchestrating AGM (Agent Graph Memory) files"
readme = "../../README.md"
keywords = ["agm", "agent", "cli", "orchestration", "graph"]
categories = ["command-line-utilities"]
exclude = ["tests/fixtures/"]

[lib]
name = "agm_cli"
path = "src/lib.rs"

[[bin]]
name = "agm"
path = "src/main.rs"

[features]
default = ["self-update"]
self-update = ["dep:self_update"]

[dependencies]
agm-core = { path = "../agm-core", version = "1.3.0", features = ["compiler"] }
clap.workspace = true
anyhow.workspace = true
miette = { workspace = true, features = ["fancy"] }
serde_json.workspace = true
serde_yaml = "0.9"
time = { version = "0.3", features = ["formatting", "parsing"] }
regex.workspace = true
log = "0.4"
self_update = { workspace = true, optional = true }
tiktoken-rs = "0.11"
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
tempfile.workspace = true
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
sha2 = "0.10"
hex = "0.4"
jsonschema = "0.26"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
mockito = "1"
insta = { workspace = true }
