[package]
name = "agm-core"
version = "1.3.0-rc.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Core library for parsing, validating, loading, and rendering AGM (Agent Graph Memory) files"
documentation = "https://docs.rs/agm-core"
readme = "../../README.md"
keywords = ["agm", "agent", "graph", "knowledge", "parser"]
categories = ["command-line-utilities", "parser-implementations", "data-structures"]
exclude = ["tests/fixtures/", "tests/snapshots/", "tests/conformance/"]

[features]
default = ["zeroize"]
compiler = ["dep:pulldown-cmark"]
zeroize = ["dep:zeroize"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
thiserror.workspace = true
miette.workspace = true
petgraph.workspace = true
regex.workspace = true
semver.workspace = true
pulldown-cmark = { workspace = true, optional = true }
jsonschema = "0.26"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
getrandom = "0.2"
zeroize = { version = "1", optional = true }
tempfile = "3"

[dev-dependencies]
insta.workspace = true
tempfile.workspace = true
